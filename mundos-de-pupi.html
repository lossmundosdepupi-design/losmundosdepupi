<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Los Mundos de Pupi</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cosmos: #0a0015;
    --nebula1: #1a0533;
    --nebula2: #0d1a3a;
    --neon-purple: #c084fc;
    --neon-blue: #60a5fa;
    --neon-pink: #f472b6;
    --neon-gold: #fbbf24;
    --neon-cyan: #22d3ee;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(192,132,252,0.25);
    --text: #e2d9f3;
    --text-dim: rgba(226,217,243,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--cosmos);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  /* COSMOS BACKGROUND */
  .cosmos-bg {
    position: fixed; inset: 0; z-index: 0;
    background: 
      radial-gradient(ellipse at 20% 30%, rgba(139,92,246,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(59,130,246,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(244,114,182,0.08) 0%, transparent 40%),
      linear-gradient(135deg, #0a0015 0%, #0d1a3a 50%, #1a0533 100%);
  }

  .stars {
    position: fixed; inset: 0; z-index: 0;
    background-image: 
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 45%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 20%, rgba(192,132,252,0.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 70%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 35%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 55%, rgba(96,165,250,0.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 90%, rgba(244,114,182,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 80%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 48% 5%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 95%, rgba(255,255,255,0.5) 0%, transparent 100%);
    animation: twinkle 4s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.7; }
    100% { opacity: 1; }
  }

  /* MAIN LAYOUT */
  .desktop {
    position: relative; z-index: 1;
    height: 100dvh;
    display: flex; flex-direction: column;
  }

  /* TOP BAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: rgba(10,0,21,0.7);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
  }

  .topbar-logo {
    font-family: 'Cinzel Decorative', serif;
    font-size: 13px;
    background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue), var(--neon-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
  }

  .topbar-time {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 300;
  }

  .topbar-actions {
    display: flex; gap: 8px;
  }

  .topbar-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--neon-purple);
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .topbar-btn:active { transform: scale(0.9); background: rgba(192,132,252,0.15); }

  /* GRID DE CARPETAS */
  .grid-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    align-content: start;
  }

  .folder {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer;
    animation: fadeInUp 0.5s ease both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .folder:nth-child(1) { animation-delay: 0.1s; }
  .folder:nth-child(2) { animation-delay: 0.2s; }
  .folder:nth-child(3) { animation-delay: 0.3s; }
  .folder:nth-child(4) { animation-delay: 0.4s; }
  .folder:nth-child(5) { animation-delay: 0.5s; }

  .folder-icon {
    width: 60px; height: 60px;
    border-radius: 16px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    position: relative;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }

  .folder-icon::before {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 17px;
    background: linear-gradient(135deg, var(--neon-purple), transparent, var(--neon-blue));
    opacity: 0;
    transition: opacity 0.3s;
    z-index: -1;
  }

  .folder:active .folder-icon {
    transform: scale(0.92);
    background: rgba(192,132,252,0.15);
  }

  .folder:active .folder-icon::before { opacity: 1; }

  .folder-glow-purple .folder-icon { box-shadow: 0 0 20px rgba(192,132,252,0.2); }
  .folder-glow-blue .folder-icon { box-shadow: 0 0 20px rgba(96,165,250,0.2); }
  .folder-glow-pink .folder-icon { box-shadow: 0 0 20px rgba(244,114,182,0.2); }
  .folder-glow-gold .folder-icon { box-shadow: 0 0 20px rgba(251,191,36,0.2); }
  .folder-glow-cyan .folder-icon { box-shadow: 0 0 20px rgba(34,211,238,0.2); }

  .folder-name {
    font-size: 10px;
    text-align: center;
    color: var(--text-dim);
    font-weight: 400;
    line-height: 1.2;
    max-width: 65px;
  }

  /* DOCK INFERIOR */
  .dock {
    padding: 10px 16px 20px;
    display: flex; justify-content: center; gap: 16px;
    flex-shrink: 0;
  }

  .dock-item {
    width: 54px; height: 54px;
    border-radius: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    cursor: pointer;
    backdrop-filter: blur(20px);
    transition: all 0.2s;
    position: relative;
  }

  .dock-item:active { transform: scale(0.9) translateY(-4px); }

  .dock-item.active-dock {
    background: rgba(192,132,252,0.2);
    border-color: var(--neon-purple);
    box-shadow: 0 0 20px rgba(192,132,252,0.4), 0 -4px 20px rgba(192,132,252,0.2);
  }

  /* PANEL / VENTANA */
  .panel-overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: flex-end;
    animation: fadeIn 0.2s ease;
  }

  .panel-overlay.open { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .panel {
    width: 100%;
    max-height: 85dvh;
    background: linear-gradient(180deg, #120025 0%, #0a0a20 100%);
    border-radius: 24px 24px 0 0;
    border-top: 1px solid var(--glass-border);
    display: flex; flex-direction: column;
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .panel-handle {
    width: 40px; height: 4px;
    background: var(--glass-border);
    border-radius: 2px;
    margin: 12px auto 0;
    flex-shrink: 0;
  }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
  }

  .panel-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 14px;
    background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .panel-close {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(244,114,182,0.15);
    border: 1px solid rgba(244,114,182,0.3);
    color: var(--neon-pink);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* CHAT */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 13px;
    line-height: 1.5;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(59,130,246,0.3));
    border: 1px solid rgba(139,92,246,0.4);
    color: var(--text);
  }

  .msg-ai {
    align-self: flex-start;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    color: var(--text);
  }

  .msg-ai-name {
    font-size: 10px;
    color: var(--neon-purple);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .msg-thinking {
    align-self: flex-start;
    display: flex; gap: 4px; align-items: center;
    padding: 10px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--neon-purple);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; background: var(--neon-blue); }
  .dot:nth-child(3) { animation-delay: 0.4s; background: var(--neon-pink); }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* INPUT */
  .chat-input-area {
    padding: 12px 16px 20px;
    display: flex; gap: 10px; align-items: flex-end;
    border-top: 1px solid var(--glass-border);
    flex-shrink: 0;
  }

  .chat-input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 13px;
    resize: none;
    min-height: 42px;
    max-height: 100px;
    outline: none;
    transition: border-color 0.2s;
  }

  .chat-input:focus { border-color: var(--neon-purple); }
  .chat-input::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 42px; height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
    border: none;
    color: white;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 0 20px rgba(192,132,252,0.4);
  }

  .send-btn:active { transform: scale(0.9); }
  .send-btn:disabled { opacity: 0.5; }

  /* BITÁCORA */
  .bitacora-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .log-entry {
    padding: 12px;
    border-radius: 12px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    margin-bottom: 10px;
  }

  .log-date {
    font-size: 10px;
    color: var(--neon-cyan);
    margin-bottom: 4px;
  }

  .log-text {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  /* AJUSTES */
  .settings-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .settings-item {
    padding: 14px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    transition: all 0.2s;
  }

  .settings-item:active { background: rgba(192,132,252,0.1); }

  .settings-label { font-size: 13px; color: var(--text); }
  .settings-sublabel { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .settings-arrow { color: var(--neon-purple); font-size: 16px; }

  /* NUEVA CARPETA MODAL */
  .modal {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }

  .modal.open { display: flex; }

  .modal-box {
    width: 100%;
    max-width: 320px;
    background: linear-gradient(135deg, #1a0533, #0d1a3a);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 24px;
    animation: scaleIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes scaleIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 14px;
    color: var(--neon-purple);
    margin-bottom: 16px;
    text-align: center;
  }

  .modal-input {
    width: 100%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 13px;
    outline: none;
    margin-bottom: 10px;
  }

  .emoji-grid {
    display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 8px; margin-bottom: 16px;
  }

  .emoji-opt {
    width: 100%; aspect-ratio: 1;
    border-radius: 10px;
    background: var(--glass);
    border: 1px solid transparent;
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .emoji-opt.selected { border-color: var(--neon-purple); background: rgba(192,132,252,0.2); }

  .modal-actions { display: flex; gap: 10px; }

  .modal-btn {
    flex: 1; padding: 10px;
    border-radius: 12px;
    font-family: 'Exo 2', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .modal-btn-cancel {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
  }

  .modal-btn-create {
    background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
    color: white;
    box-shadow: 0 0 16px rgba(192,132,252,0.4);
  }

  .modal-btn:active { transform: scale(0.96); }

  /* SCROLL */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 2px; }

  /* NOTIFICACIÓN */
  .toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(192,132,252,0.2);
    border: 1px solid var(--neon-purple);
    backdrop-filter: blur(20px);
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--neon-purple);
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; }

  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    font-family: 'Exo 2', sans-serif;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .filter-btn.active {
    background: rgba(192,132,252,0.2);
    border-color: var(--neon-purple);
    color: var(--neon-purple);
  }

  .api-key-input {
    width: 100%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 12px;
    outline: none;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="cosmos-bg"></div>
<div class="stars"></div>

<div class="desktop">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">⬡ Los Mundos de Pupi</div>
    <div class="topbar-time" id="clock">--:--</div>
    <div class="topbar-actions">
      <div class="topbar-btn" onclick="openModal()">＋</div>
      <div class="topbar-btn" onclick="openPanel('ajustes')">⚙</div>
    </div>
  </div>

  <!-- GRID -->
  <div class="grid-area" id="grid">
    <!-- carpetas por defecto -->
  </div>

  <!-- DOCK -->
  <div class="dock">
    <div class="dock-item active-dock" onclick="openPanel('claude')" title="Claude">🧠</div>
    <div class="dock-item" onclick="openPanel('bitacora')" title="Bitácora">📖</div>
    <div class="dock-item" onclick="openPanel('proyectos')" title="Proyectos">🚀</div>
    <div class="dock-item" onclick="openPanel('ajustes')" title="Ajustes">⚙️</div>
  </div>
</div>

<!-- PANEL OVERLAY -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanelOnBg(event)">
  <div class="panel" id="panel">
    <div class="panel-handle"></div>
    <div class="panel-header">
      <div class="panel-title" id="panelTitle">Panel</div>
      <div class="panel-close" onclick="closePanel()">✕</div>
    </div>
    <div id="panelContent" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>
  </div>
</div>

<!-- MODAL NUEVA CARPETA -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title">✦ Nueva Carpeta</div>
    <input class="modal-input" id="folderName" placeholder="Nombre de la carpeta..." />
    <div class="emoji-grid" id="emojiGrid"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn modal-btn-create" onclick="createFolder()">Crear</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
// ESTADO DEL SISTEMA
// ═══════════════════════════════════════
const STATE = {
  folders: JSON.parse(localStorage.getItem('pupi_folders') || 'null') || [
    { id: 'claude-chat', name: 'Claude', emoji: '🧠', glow: 'purple' },
    { id: 'pupigenda', name: 'PUPIgenda', emoji: '📅', glow: 'blue' },
    { id: 'crypto', name: 'Cripto Bot', emoji: '📈', glow: 'gold' },
    { id: 'musica', name: 'Música', emoji: '🎸', glow: 'pink' },
    { id: 'ideas', name: 'Ideas', emoji: '💡', glow: 'cyan' },
  ],
  chatHistory: JSON.parse(localStorage.getItem('pupi_chat') || '[]'),
  bitacora: JSON.parse(localStorage.getItem('pupi_bitacora') || '[]'),
  apiKey: localStorage.getItem('pupi_apikey') || '',
  selectedEmoji: '📁',
  currentPanel: null,
};

const EMOJIS = ['📁','🧠','🚀','💡','⚡','🎸','📈','🔧','🌍','🔮','🎯','💎','🤖','🌙','⭐','🔑','📖','🎨','🛠️','💫','🌀','🔬','🎮','💻'];

// ═══════════════════════════════════════
// RELOJ
// ═══════════════════════════════════════
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}
updateClock();
setInterval(updateClock, 1000);

// ═══════════════════════════════════════
// GRID DE CARPETAS
// ═══════════════════════════════════════
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = STATE.folders.map(f => `
    <div class="folder folder-glow-${f.glow || 'purple'}" onclick="openFolder('${f.id}')">
      <div class="folder-icon">${f.emoji}</div>
      <div class="folder-name">${f.name}</div>
    </div>

function openPanel(type) {
  STATE.currentPanel = type;

async function closePanel() {
  // Si cerramos el chat de Claude y hubo conversación, generar resumen de sesión
  if (STATE.currentPanel === 'claude' && STATE.chatHistory.length >= 4) {
    await generateSessionSummary();
  }
  document.getElementById('panelOverlay').classList.remove('open');
  STATE.currentPanel = null;
}

function closePanelOnBg(e) {
  if (e.target === document.getElementById('panelOverlay')) closePanel();
}

async function generateSessionSummary() {
  if (!STATE.apiKey) return;
  const sessionMsgs = STATE.chatHistory.slice(-30);
  if (sessionMsgs.length < 2) return;

  const transcript = sessionMsgs.map(m =>
    `[${m.role === 'user' ? 'UNAI' : 'CLAUDE'}]: ${m.content}`
  ).join('\n');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `Eres el sistema de memoria de "Los Mundos de Pupi". Tu única función es analizar conversaciones y generar resúmenes estructurados para la bitácora. Responde SOLO en JSON, sin markdown, sin explicaciones.`,
        messages: [{
          role: 'user',
          content: `Analiza esta conversación y genera un resumen estructurado en JSON con este formato exacto:
{
  "relevante": "string — decisiones tomadas, avances, ideas importantes, cambios en proyectos. Máx 200 chars.",
  "memoria": "string — lo que Claude debe recordar obligatoriamente en la próxima sesión. Máx 150 chars.",
  "cronologico": "string — resumen cronológico objetivo de lo que pasó. Máx 200 chars.",
  "descartar": "string — temas cerrados, descartados o sin relevancia futura. Puede ser vacío."
}

CONVERSACIÓN:
${transcript}`
        }]
      })
    });

    const data = await res.json();
    if (!data.content || !data.content[0]) return;

    let summary;
    try {
      const raw = data.content[0].text.replace(/```json|```/g, '').trim();
      summary = JSON.parse(raw);
    } catch { return; }

    const now = new Date().toLocaleString('es-ES');

    if (summary.relevante) {
      STATE.bitacora.push({ date: now, categoria: 'relevante', text: `🚀 AVANCE RELEVANTE\n${summary.relevante}` });
    }
    if (summary.memoria) {
      STATE.bitacora.push({ date: now, categoria: 'memoria', text: `📌 MEMORIA PARA PRÓXIMA SESIÓN\n${summary.memoria}` });
    }
    if (summary.cronologico) {
      STATE.bitacora.push({ date: now, categoria: 'cronologico', text: `📋 REGISTRO CRONOLÓGICO\n${summary.cronologico}` });
    }
    if (summary.descartar && summary.descartar.trim()) {
      STATE.bitacora.push({ date: now, categoria: 'descartar', text: `🗑️ DESCARTADO\n${summary.descartar}` });
    }

    localStorage.setItem('pupi_bitacora', JSON.stringify(STATE.bitacora.slice(-200)));
  } catch (e) {
    console.error('Error generando resumen:', e);
  }
}

function buildChatUI() {
  return `
    <div class="chat-messages" id="chatMessages"></div>

      <textarea class="chat-input" id="chatInput" placeholder="Escribe a Claude..." rows="1"

  `;
}

function renderChatHistory() {
  const container = document.getElementById('chatMessages');
  if (!container) return;
  container.innerHTML = '';
  STATE.chatHistory.forEach(msg => {
    appendMessage(msg.role, msg.content, false);
  });
  scrollChat();
}

function appendMessage(role, text, save = true) {
  const container = document.getElementById('chatMessages');
  if (!container) return;

  const div = document.createElement('div');
  div.className = role === 'user' ? 'msg msg-user' : 'msg msg-ai';

  if (role === 'assistant') {
    div.innerHTML = `<div class="msg-ai-name">◈ Claude</div>${escapeHtml(text).replace(/\n/g,'<br>')}`;
  } else {
    div.textContent = text;
  }

  container.appendChild(div);
  scrollChat();

  if (save) {
    STATE.chatHistory.push({ role, content: text });
    localStorage.setItem('pupi_chat', JSON.stringify(STATE.chatHistory.slice(-60)));
  }
}

function addAIMessage(text) {
  appendMessage('assistant', text, true);
}

function showThinking() {
  const container = document.getElementById('chatMessages');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'msg-thinking';
  div.id = 'thinking';
  div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  container.appendChild(div);
  scrollChat();
}

function removeThinking() {
  const t = document.getElementById('thinking');
  if (t) t.remove();
}

function scrollChat() {
  const c = document.getElementById('chatMessages');
  if (c) c.scrollTop = c.scrollHeight;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

async function sendMessage() {

═══════════════════════════════════════
QUIÉN ES UNAI
═══════════════════════════════════════
- Nombre: Unai. Mote: Pupi. Ubicación: País Vasco (Euskadi), España.

- Trabaja principalmente desde un móvil Android (Xiaomi Redmi Note 14 Pro Plus) usando Pydroid 3.
- Tiene pasión profunda por crear sistemas, automatizaciones e ideas. Le apasiona construir, experimentar y escalar.
- Tiene interés en música y procesamiento de audio de guitarra en tiempo real.
- Es una persona directa, curiosa, con pensamiento sistémico y capacidad de aprender rápido de forma autodidacta.

function buildBitacoraUI() {
  return `
    <div style="display:flex;gap:8px;padding:10px 16px 0;flex-shrink:0;overflow-x:auto;">
      <button class="filter-btn active" onclick="filterBitacora('all',this)">Todos</button>
      <button class="filter-btn" onclick="filterBitacora('relevante',this)">🚀 Avances</button>
      <button class="filter-btn" onclick="filterBitacora('memoria',this)">📌 Memoria</button>
      <button class="filter-btn" onclick="filterBitacora('cronologico',this)">📋 Registro</button>
      <button class="filter-btn" onclick="filterBitacora('manual',this)">✍️ Manual</button>
      <button class="filter-btn" onclick="filterBitacora('descartar',this)">🗑️ Descartado</button>
    </div>
    <div class="bitacora-content" id="bitacoraContent"></div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="logInput" placeholder="Añadir nota manual..." rows="1" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="addLogEntry()">＋</button>
    </div>
  `;
}

const CATEGORIA_COLORS = {
  relevante: 'var(--neon-cyan)',
  memoria: 'var(--neon-purple)',
  cronologico: 'var(--neon-blue)',
  descartar: 'rgba(244,114,182,0.6)',
  manual: 'var(--neon-gold)',
};

STATE.bitacoraFilter = 'all';

function filterBitacora(cat, btn) {
  STATE.bitacoraFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBitacora();
}

function renderBitacora() {
  const c = document.getElementById('bitacoraContent');
  if (!c) return;

  let entries = [...STATE.bitacora].reverse();
  if (STATE.bitacoraFilter !== 'all') {
    entries = entries.filter(e => (e.categoria || 'manual') === STATE.bitacoraFilter);
  }

  if (entries.length === 0) {
    c.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:40px;font-size:13px;">Sin entradas en esta categoría.</div>';
    return;
  }

  c.innerHTML = entries.map(e => {
    const cat = e.categoria || 'manual';
    const color = CATEGORIA_COLORS[cat] || 'var(--neon-gold)';
    return `
      <div class="log-entry" style="border-left:3px solid ${color};">
        <div class="log-date" style="color:${color};">${e.date}</div>
        <div class="log-text">${escapeHtml(e.text).replace(/\n/g,'<br>')}</div>
      </div>
    `;
  }).join('');
}

function addLogEntry() {
  const input = document.getElementById('logInput');
  const text = input.value.trim();
  if (!text) return;
  const entry = { date: new Date().toLocaleString('es-ES'), categoria: 'manual', text: `✍️ ${text}` };
  STATE.bitacora.push(entry);
  localStorage.setItem('pupi_bitacora', JSON.stringify(STATE.bitacora.slice(-200)));
  input.value = '';
  input.style.height = 'auto';
  renderBitacora();
  showToast('Nota guardada ✓');
}

function autoLogEntry(text) {
  const entry = { date: new Date().toLocaleString('es-ES'), categoria: 'cronologico', text };
  STATE.bitacora.push(entry);
  localStorage.setItem('pupi_bitacora', JSON.stringify(STATE.bitacora.slice(-200)));
}
